baseURL = "/"
languageCode = "fr-fr"
title = "Portfolio de Stéphan Uniatowitz - Expert Support Technique & Infrastructure"
theme = "blowfish"
ignoreLogs = ['warning-goldmark-raw-html']


[params]
  description = "Expert dépannage informatique Marseille : PC, Mac, réseaux, automation. Support technique N2/N3 pour particuliers et professionnels. Intervention rapide."
  keywords = ["dépannage informatique marseille", "technicien it marseille", "réparation pc marseille", "support technique", "automatisation", "réseaux"]
  [params.author]
    name = "Stéphan Uniatowitz"
    email = "contact@mon-portfolio.fr" # Requis pour RSS
    image = "images/steph_profile_optimized.jpg"
    headline = "Technicien IT & Expert Support Technique"
    bio = "Expert dépannage informatique Marseille : PC, Mac, réseaux, automation."
    links = [
      { email = "mailto:contact@mon-portfolio.fr" },
      { linkedin = "https://www.linkedin.com/in/stephan-uniatowitz-259360101" },
      { github = "https://github.com/stephan-uniatowitz" }
    ]
  
  # SEO Local
  city = "Marseille"
  region = "Bouches-du-Rhône"
  country = "France"
  
  # Social
  linkedin = "https://www.linkedin.com/in/stephan-uniatowitz-259360101"
  github = "https://github.com/stephan-uniatowitz"

# Sitemap Configuration
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"
  quartier = "quartiers"

# Permalinks
[permalinks]
  depannage = "/depannage/:slug/"
  automation = "/automation/:slug/"
  marseille = "/marseille/:slug/"
  blog = "/blog/:slug/"

# Related Content
[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80

# Minify Output (Production)
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

