<section class="py-20 bg-white dark:bg-gray-900 overflow-hidden">
    <div class="container mx-auto px-4">
        <!-- Header Section -->
        <div class="text-center max-w-3xl mx-auto mb-16">
            <h2 class="text-3xl md:text-4xl font-heading font-bold text-gray-900 dark:text-white mb-4">
                {{ .title }}
            </h2>
            <p class="text-xl text-gray-600 dark:text-gray-400">
                {{ .subtitle }}
            </p>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-8 mb-20">
            {{ range .stats }}
            <div
                class="text-center p-6 rounded-2xl bg-gray-50 dark:bg-gray-800/50 border border-gray-100 dark:border-gray-700 card-hover">
                <div
                    class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-purple-600 mb-2">
                    {{ .number }}
                </div>
                <div class="text-sm font-medium text-gray-500 dark:text-gray-400 tracking-wide uppercase">
                    {{ .label }}
                </div>
            </div>
            {{ end }}
        </div>

        <!-- Testimonials Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            {{ range .testimonials }}
            <div
                class="relative p-8 rounded-3xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-xl shadow-gray-200/50 dark:shadow-none card-hover">
                <!-- Quote Icon -->
                <div
                    class="absolute -top-4 -left-4 w-10 h-10 bg-primary-600 rounded-full flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-quote-left text-sm"></i>
                </div>

                <div class="mb-6">
                    <div class="flex text-yellow-400 mb-2">
                        <i class="fas fa-star text-xs"></i>
                        <i class="fas fa-star text-xs"></i>
                        <i class="fas fa-star text-xs"></i>
                        <i class="fas fa-star text-xs"></i>
                        <i class="fas fa-star text-xs"></i>
                    </div>
                    <p class="text-gray-700 dark:text-gray-300 italic leading-relaxed">
                        "{{ .content }}"
                    </p>
                </div>

                <div class="flex items-center">
                    <div
                        class="w-12 h-12 rounded-full bg-gradient-to-br from-primary-500 to-purple-500 flex items-center justify-center text-white font-bold text-lg">
                        {{ substr .name 0 1 }}
                    </div>
                    <div class="ml-4">
                        <div class="font-bold text-gray-900 dark:text-white">{{ .name }}</div>
                        <div class="text-sm text-gray-500 dark:text-gray-400">{{ .role }}</div>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>

        <!-- Certification Badges -->
        <div
            class="mt-20 pt-10 border-t border-gray-100 dark:border-gray-800 flex flex-wrap justify-center items-center gap-12 opacity-60 hover:opacity-100 transition-opacity">
            <div class="flex items-center space-x-2 grayscale hover:grayscale-0 transition-all">
                <i class="fas fa-shield-halved text-2xl text-primary-600"></i>
                <span class="font-bold text-gray-600 dark:text-gray-400">Intervention Sécurisée</span>
            </div>
            <div class="flex items-center space-x-2 grayscale hover:grayscale-0 transition-all">
                <i class="fas fa-map-marker-alt text-2xl text-red-500"></i>
                <span class="font-bold text-gray-600 dark:text-gray-400">Local (Marseille)</span>
            </div>
            <div class="flex items-center space-x-2 grayscale hover:grayscale-0 transition-all">
                <i class="fas fa-user-graduate text-2xl text-blue-500"></i>
                <span class="font-bold text-gray-600 dark:text-gray-400">Certifié ITIL / Support</span>
            </div>
        </div>
    </div>
</section>
